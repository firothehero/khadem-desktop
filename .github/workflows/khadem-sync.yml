# Khadem: weekly merge of upstream Hermes Desktop with the Arabic-layer gate.
# Opens (or updates) a pull request from `khadem/upstream-sync` so a human reviews every sync.
name: Khadem upstream sync

on:
  schedule:
    - cron: "41 3 * * 1" # Mondays 03:41 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: khadem-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository != 'fathah/hermes-desktop'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure git
        run: |
          git config user.name "khadem-sync[bot]"
          git config user.email "khadem-sync@users.noreply.github.com"
      - name: Merge upstream
        id: merge
        run: |
          git checkout -B khadem/upstream-sync
          SKIP_CHECKS=1 scripts/khadem/sync-upstream.sh | tee merge.log
          if git diff --quiet origin/${{ github.event.repository.default_branch }} HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Khadem checks
        if: steps.merge.outputs.changed == 'true'
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          scripts/khadem/check.sh 2>&1 | tee check.log
      - name: Push branch and open PR
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push --force-with-lease origin khadem/upstream-sync
          body=$(printf 'Automated merge of upstream Hermes Desktop `main`.\n\n```\n%s\n```\n\nKhadem checks (Arabic coverage last):\n```\n%s\n```\n' \
            "$(tail -n 5 merge.log)" "$(tail -n 12 check.log)")
          gh pr view khadem/upstream-sync >/dev/null 2>&1 \
            && gh pr edit khadem/upstream-sync --body "$body" \
            || gh pr create --head khadem/upstream-sync --title "Sync upstream Hermes Desktop" --body "$body"
