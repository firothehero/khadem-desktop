# Khadem: weekly merge of upstream Hermes Desktop with the Arabic-layer gate.
# Opens (or updates) a pull request from `khadem/upstream-sync` so a human reviews every sync.
name: Khadem upstream sync

on:
  schedule:
    - cron: "41 3 * * 1" # Mondays 03:41 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: khadem-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository != 'fathah/hermes-desktop'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Optional PAT (repo + workflow scopes): the built-in token cannot push merges that touch
          # .github/workflows, which upstream syncs often do. Without it, the job falls back to an issue.
          token: ${{ secrets.KHADEM_SYNC_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure git
        run: |
          git config user.name "khadem-sync[bot]"
          git config user.email "khadem-sync@users.noreply.github.com"
      - name: Merge upstream
        id: merge
        run: |
          git checkout -B khadem/upstream-sync
          SKIP_CHECKS=1 scripts/khadem/sync-upstream.sh | tee merge.log
          if git diff --quiet origin/${{ github.event.repository.default_branch }} HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Khadem checks
        if: steps.merge.outputs.changed == 'true'
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          scripts/khadem/check.sh 2>&1 | tee check.log
      - name: Push branch and open PR (or report in an issue)
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.KHADEM_SYNC_TOKEN || github.token }}
        run: |
          summary=$(printf 'Automated merge of upstream `main`.\n\n```\n%s\n```\n\nKhadem checks:\n```\n%s\n```\n' \
            "$(tail -n 5 merge.log)" "$(tail -n 12 check.log 2>/dev/null)")
          if git push --force-with-lease origin khadem/upstream-sync; then
            if gh pr view khadem/upstream-sync >/dev/null 2>&1; then
              gh pr edit khadem/upstream-sync --body "$summary" && exit 0
            else
              gh pr create --head khadem/upstream-sync --title "Sync upstream" --body "$summary" && exit 0
            fi
            note="The branch \`khadem/upstream-sync\` was pushed but a pull request could not be opened (enable *Allow GitHub Actions to create and approve pull requests* in Settings → Actions, or add a \`KHADEM_SYNC_TOKEN\` secret). Open it from the branch."
          else
            note="The merge could not be pushed with the built-in token (upstream changed workflow files). Run \`scripts/khadem/sync-upstream.sh\` locally and push, or add a \`KHADEM_SYNC_TOKEN\` secret (PAT with repo + workflow scopes)."
          fi
          body=$(printf '%s\n\n%s' "$note" "$summary")
          num=$(gh issue list --state open --search "in:title Upstream sync ready" --json number --jq '.[0].number' || true)
          if [ -n "$num" ]; then gh issue comment "$num" --body "$body" && exit 0; else gh issue create --title "Upstream sync ready" --body "$body" && exit 0; fi
          # Repository settings block both PRs and issues for the Actions token: leave the result in the
          # run summary (the branch is already pushed when the push succeeded).
          printf '%s\n\nOpen the PR: %s/%s/compare/%s...khadem/upstream-sync\n' "$body" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "${{ github.event.repository.default_branch }}" >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::Upstream sync is ready on branch khadem/upstream-sync — open a PR (Actions may not create PRs/issues in this repo)."
